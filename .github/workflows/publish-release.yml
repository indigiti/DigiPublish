name: Publish DigiPublish Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/{print $2; exit}' digipublish/style.css)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          zip -qr "digipublish-v${version}.zip" digipublish
          zip -qr "digipublish-core-v${version}.zip" digipublish-core
          zip -qr "digipublish-framework-v${version}.zip" digipublish digipublish-core README.md CHANGELOG.md

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          {
            echo "## DigiPublish v${version}"
            echo
            awk -v heading="## ${version}" '
              $0 == heading { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Packages"
            echo "- `digipublish-v${version}.zip` — WordPress theme"
            echo "- `digipublish-core-v${version}.zip` — companion plugin"
            echo "- `digipublish-framework-v${version}.zip` — complete framework"
          } > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Release notes are empty."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "DigiPublish ${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "DigiPublish ${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}"               "digipublish-v${VERSION}.zip"               "digipublish-core-v${VERSION}.zip"               "digipublish-framework-v${VERSION}.zip"               --clobber
          else
            gh release create "${TAG}"               "digipublish-v${VERSION}.zip"               "digipublish-core-v${VERSION}.zip"               "digipublish-framework-v${VERSION}.zip"               --title "DigiPublish ${TAG}"               --notes-file release-notes.md               --target "${GITHUB_SHA}"
          fi
