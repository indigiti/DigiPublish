name: DigiPublish Release Gates

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development test tooling
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WordPress integration environment
        run: npx wp-env start

      - name: Seed representative publishing content
        run: npm run env:seed

      - name: Run browser, editor, accessibility and performance gates
        run: npm run test:e2e

      - name: Show WordPress debug log on failure
        if: failure()
        run: |
          npx wp-env run cli bash -lc 'test -f wp-content/debug.log && cat wp-content/debug.log || true'

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: digipublish-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop WordPress integration environment
        if: always()
        run: npx wp-env stop
