name: Validate DigiPublish

on:
  push:
    branches: ["main", "rebrand/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find digipublish digipublish-core -type f -name '*.php' -print0)

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done < <(find digipublish digipublish-core -type f -name '*.json' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find digipublish digipublish-core -type f -name '*.js' -print0)

      - name: Guard editorial query architecture
        shell: bash
        run: |
          set -euo pipefail
          core="digipublish-core/techpress-editorial.php"
          query="digipublish-core/includes/query.php"
          editor="digipublish-core/assets/editor.js"
          editor_query="digipublish-core/assets/editor-query.js"

          test -f "$query"
          test -f "$editor_query"
          grep -Fq "require_once DIGIPUBLISH_CORE_DIR . 'includes/query.php'" "$core" || exit 1

          for fn in digipublish_core_query_post_args digipublish_core_query_feed_args digipublish_core_query_feed_posts digipublish_core_query_view_all_url; do
            grep -Fq "function $fn" "$query" || {
              echo "Missing canonical query service function: $fn"
              exit 1
            }
          done

          # Query-heavy blocks must consume canonical DigiPublish query APIs.
          grep -Fq 'digipublish_core_query_post_args' digipublish-core/blocks/post-feed/render.php || exit 1
          grep -Fq 'digipublish_core_query_post_args' digipublish-core/blocks/featured-posts/render.php || exit 1
          grep -Fq 'digipublish_core_query_feed_posts' digipublish-core/blocks/editorial-feed/render.php || exit 1
          grep -Fq 'digipublish_core_query_feed_posts' digipublish-core/blocks/sidebar-feed/render.php || exit 1

          # Legacy query names may exist only inside the dedicated compatibility layer.
          if grep -R --line-number --include='*.php' -E 'techpress_editorial_(post_query_args|feed_query_args|feed_get_posts|feed_view_all_url)[[:space:]]*\(' digipublish-core/blocks; then
            echo "A block renderer bypasses the canonical DigiPublish query service."
            exit 1
          fi

          grep -Fq "digipublish-core-editor-query" "$core" || exit 1
          grep -Fq "DigiPublishEditorQuery" "$editor_query" || exit 1
          grep -Fq "DigiPublishEditorQuery" "$editor" || exit 1

          # Keep the main bootstrap/editor from absorbing the extracted modules again.
          test "$(wc -c < "$core")" -lt 60000 || {
            echo "Core bootstrap exceeded the architectural size budget."
            exit 1
          }
          test "$(wc -c < "$editor")" -lt 138000 || {
            echo "Main editor bundle exceeded the current size budget."
            exit 1
          }


      - name: Guard canonical DigiPublish callable namespace
        shell: bash
        run: |
          set -euo pipefail

          core="digipublish-core/techpress-editorial.php"
          core_compat="digipublish-core/includes/compatibility.php"
          theme="digipublish/functions.php"
          theme_compat="digipublish/inc/compatibility.php"

          test -f "$core_compat"
          test -f "$theme_compat"
          grep -Fq "includes/compatibility.php" "$core" || exit 1
          grep -Fq "inc/compatibility.php" "$theme" || exit 1

          # Canonical constants own runtime configuration.
          grep -Fq "define( 'DIGIPUBLISH_CORE_VERSION'" "$core" || exit 1
          grep -Fq "define( 'DIGIPUBLISH_CORE_DIR'" "$core" || exit 1
          grep -Fq "define( 'DIGIPUBLISH_CORE_URL'" "$core" || exit 1
          grep -Fq "define( 'TECHPRESS_EDITORIAL_VERSION', DIGIPUBLISH_CORE_VERSION" "$core" || exit 1
          grep -Fq "define( 'TECHPRESS_EDITORIAL_DIR', DIGIPUBLISH_CORE_DIR" "$core" || exit 1
          grep -Fq "define( 'TECHPRESS_EDITORIAL_URL', DIGIPUBLISH_CORE_URL" "$core" || exit 1

          # Production PHP cannot call legacy callable namespaces.
          if grep -R --line-number --include='*.php'             --exclude='compatibility.php'             -E 'techpress_editorial_[A-Za-z0-9_]+[[:space:]]*\(|techpress_theme_[A-Za-z0-9_]+[[:space:]]*\(|digipublish_caards_[A-Za-z0-9_]+[[:space:]]*\('             digipublish digipublish-core; then
            echo "Legacy callable namespace escaped the compatibility layer."
            exit 1
          fi

          # Compatibility files must still expose representative old APIs.
          grep -Fq "function techpress_editorial_register_content_types" "$core_compat" || exit 1
          grep -Fq "function techpress_editorial_post_query_args" "$core_compat" || exit 1
          grep -Fq "function techpress_theme_setup" "$theme_compat" || exit 1
          grep -Fq "function digipublish_caards_load_next_enabled" "$theme_compat" || exit 1

          # Representative canonical APIs must remain first-class.
          grep -Fq "function digipublish_core_register_content_types" "$core" || exit 1
          grep -Fq "function digipublish_core_image_markup" "$core" || exit 1
          grep -Fq "function digipublish_core_read_time" "$core" || exit 1
          grep -Fq "function digipublish_theme_setup" "$theme" || exit 1
          grep -Fq "function digipublish_load_next_enabled" "$theme" || exit 1


      - name: Guard canonical stored-data namespace
        shell: bash
        run: |
          set -euo pipefail
          core="digipublish-core/techpress-editorial.php"
          compat="digipublish-core/includes/data-compatibility.php"
          editor="digipublish-core/assets/editor.js"

          test -f "$compat"
          grep -Fq "includes/data-compatibility.php" "$core" || exit 1

          for canonical in             _digipublish_attribution_type             _digipublish_attribution_user             _digipublish_views             _digipublish_shares             digipublish_role             digipublish_linkedin             digipublish_x             digipublish_instagram             digipublish_youtube; do
            grep -Fq "$canonical" "$compat" "$core" "$editor" digipublish-core/blocks/*/render.php || {
              echo "Missing canonical stored-data key: $canonical"
              exit 1
            }
          done

          for legacy in             _techpress_attribution_type             _techpress_attribution_user             _techpress_views             _techpress_shares             techpress_role             techpress_linkedin             techpress_x             techpress_instagram             techpress_youtube; do
            grep -Fq "$legacy" "$compat" "$editor" || {
              echo "Missing required legacy stored-data compatibility key: $legacy"
              exit 1
            }
          done

          # Active PHP renderers/bootstrap do not directly read historical meta keys.
          if grep -R --line-number -E "(_techpress_attribution_(type|user)|_techpress_(views|shares)|techpress_(role|linkedin|x|instagram|youtube))"             digipublish-core/blocks --include='*.php'; then
            echo "Historical stored-data key leaked back into an active renderer."
            exit 1
          fi
          ! grep -Eq "(_techpress_attribution_(type|user)|_techpress_(views|shares)|techpress_(role|linkedin|x|instagram|youtube))" "$core" || exit 1

          # Editor writes canonical attribution keys; old keys are fallback reads only.
          test "$(grep -c '_techpress_attribution_' "$editor")" -eq 2 || {
            echo "Unexpected legacy attribution usage in editor."
            exit 1
          }
          grep -Fq "updateMeta({ _digipublish_attribution_type:" "$editor" || exit 1
          grep -Fq "updateMeta({ _digipublish_attribution_user:" "$editor" || exit 1

          # Direct writes in either namespace are mirrored during the compatibility window.
          grep -Fq "added_post_meta" "$compat" || exit 1
          grep -Fq "updated_post_meta" "$compat" || exit 1
          grep -Fq "deleted_post_meta" "$compat" || exit 1
          grep -Fq "added_user_meta" "$compat" || exit 1
          grep -Fq "updated_user_meta" "$compat" || exit 1
          grep -Fq "deleted_user_meta" "$compat" || exit 1

          # New cache traffic uses the canonical cache group.
          for file in "$core" digipublish-core/includes/query.php digipublish-core/includes/gallery.php; do
            ! grep -Fq "'techpress_editorial'" "$file" || {
              echo "Historical cache group remains active: $file"
              exit 1
            }
          done
          grep -Fq "'digipublish_core'" "$core" || exit 1
          grep -Fq "'digipublish_core'" digipublish-core/includes/query.php || exit 1
          grep -Fq "'digipublish_core'" digipublish-core/includes/gallery.php || exit 1

          # CPT/taxonomy identifiers are intentionally frozen until their own
          # database/rewrite migration is designed and tested.
          grep -Fq "register_post_type(" "$core" || exit 1
          grep -Fq "'tech_term'" "$core" || exit 1
          grep -Fq "'tech_topic'" "$core" || exit 1


      - name: Guard Core layout consolidation
        shell: bash
        run: |
          set -euo pipefail

          for block in section section-content section-sidebar section-heading; do
            jq -e '.supports.inserter == false' "digipublish-core/blocks/$block/block.json" >/dev/null || {
              echo "Legacy structural block returned to the inserter: $block"
              exit 1
            }
          done

          for pattern in editorial-section-right editorial-section-left editorial-section-full section-heading-accent section-heading-accent-box; do
            test -f "digipublish/patterns/$pattern.php" || {
              echo "Missing Core layout replacement pattern: $pattern"
              exit 1
            }
          done

          if grep -R --line-number -E 'wp:digipublish/(section|section-content|section-sidebar|section-heading)'             digipublish/patterns/editorial-section-right.php             digipublish/patterns/editorial-section-left.php             digipublish/patterns/editorial-section-full.php             digipublish/patterns/section-heading-accent.php             digipublish/patterns/section-heading-accent-box.php; then
            echo "New layout patterns must use WordPress Core blocks, not legacy DigiPublish structural blocks."
            exit 1
          fi

          grep -Fq "register_block_style(" digipublish/functions.php || exit 1
          grep -Fq "'core/columns'" digipublish/functions.php || exit 1
          grep -Fq "'digipublish-editorial-section'" digipublish/functions.php || exit 1
          grep -Fq "'core/heading'" digipublish/functions.php || exit 1
          grep -Fq "'digipublish-accent'" digipublish/functions.php || exit 1
          grep -Fq "'digipublish-accent-box'" digipublish/functions.php || exit 1

          test -f digipublish/assets/css/core-section.css
          test -f digipublish/assets/css/core-heading.css
          grep -Fq 'is-style-digipublish-editorial-section' digipublish/assets/css/core-section.css || exit 1
          grep -Fq 'is-style-digipublish-accent' digipublish/assets/css/core-heading.css || exit 1

          # Saved content compatibility remains: old blocks are still registered.
          php -r '$m=require $argv[1]; foreach (array("section","section-content","section-sidebar","section-heading") as $b) { if (!isset($m[$b])) exit(1); }' digipublish-core/blocks-manifest.php || {
            echo "Legacy structural blocks must remain registered for saved-content compatibility."
            exit 1
          }


      - name: Guard native visibility transition
        shell: bash
        run: |
          set -euo pipefail
          core="digipublish-core/techpress-editorial.php"
          editor="digipublish-core/assets/editor.js"
          native="digipublish-core/assets/editor-native.js"

          test -f "$native"
          grep -Fq "digipublish-core-editor-native" "$core" || exit 1
          grep -Fq "wp-hooks" "$core" || exit 1
          grep -Fq "blocks.registerBlockType" "$native" || exit 1
          grep -Fq "visibility: true" "$native" || exit 1

          for block in archive-feed category-nav current-date custom-link editorial-feed featured-posts gallery-archive instagram-carousel opt-in-form post-feed related-posts section section-content section-sidebar section-heading sidebar-feed twitter-carousel; do
            jq -e '.supports.visibility == true' "digipublish-core/blocks/$block/block.json" >/dev/null || {
              echo "Native WordPress visibility support is missing: $block"
              exit 1
            }
          done

          grep -Fq "Legacy Visibility" "$editor" || exit 1
          grep -Fq "WordPress Visibility" "$editor" || exit 1
          ! grep -Fq "Responsive Settings" "$editor" || {
            echo "Parallel DigiPublish viewport-visibility panel returned."
            exit 1
          }

          # Compatibility attributes/classes remain until saved legacy rules are cleared.
          grep -Fq "hideDesktop" digipublish-core/blocks/post-feed/block.json || exit 1
          grep -Fq "dp-hide-desktop" digipublish-core/blocks/post-feed/style.css || exit 1


      - name: Guard DigiPublish design system
        shell: bash
        run: |
          set -euo pipefail
          theme="digipublish/theme.json"
          css="digipublish/assets/css/site.css"
          funcs="digipublish/functions.php"
          compat="digipublish/inc/compatibility.php"
          interactions="digipublish/assets/js/site-interactions.js"

          jq empty "$theme"
          jq empty digipublish/styles/dark.json
          jq empty digipublish/styles/editorial.json
          jq empty digipublish/styles/high-contrast.json

          # User-facing Global Styles/template labels are DigiPublish-native.
          ! grep -Eq '"(name|title)"[[:space:]]*:[[:space:]]*"Caards' "$theme" || {
            echo "Caards branding returned to user-facing theme.json labels."
            exit 1
          }
          grep -Fq '"title": "DigiPublish Dark"' digipublish/styles/dark.json || exit 1
          grep -Fq '"title": "DigiPublish Editorial"' digipublish/styles/editorial.json || exit 1
          grep -Fq '"title": "DigiPublish High Contrast"' digipublish/styles/high-contrast.json || exit 1
          grep -Fq '"title": "DigiPublish Post — Standard"' "$theme" || exit 1
          grep -Fq '"title": "Header — DigiPublish 1"' "$theme" || exit 1

          # Compatibility palette slugs are not exposed as duplicate Global Style choices.
          for canonical_slug in site surface white primary secondary accent accent-hover border dark dark-site; do
            jq -e --arg slug "$canonical_slug" '.settings.color.palette[] | select(.slug == $slug)' "$theme" >/dev/null || {
              echo "Required DigiPublish palette color is missing: $canonical_slug"
              exit 1
            }
          done
          for legacy_slug in ink body muted brand brand-dark surface-soft footer; do
            ! jq -e --arg slug "$legacy_slug" '.settings.color.palette[] | select(.slug == $slug)' "$theme" >/dev/null || {
              echo "Compatibility color leaked back into the editor palette: $legacy_slug"
              exit 1
            }
            grep -Fq -- "--wp--preset--color--$legacy_slug:" "$css" || {
              echo "Missing saved-content preset variable compatibility: $legacy_slug"
              exit 1
            }
          done

          # Canonical design tokens own active CSS; old token names are aliases only.
          for token in             --dp-canvas             --dp-surface             --dp-surface-raised             --dp-text             --dp-text-muted             --dp-brand             --dp-brand-hover             --dp-border             --dp-surface-dark             --dp-canvas-dark             --dp-radius-card             --dp-layout-wide             --dp-layout-content; do
            grep -Fq -- "$token:" "$css" || {
              echo "Missing canonical design token: $token"
              exit 1
            }
          done
          ! grep -Eq 'var\(--dp-caards-' "$css" || {
            echo "Active CSS still consumes legacy Caards token variables."
            exit 1
          }
          grep -Fq -- '--dp-caards-site:var(--dp-canvas)' "$css" || exit 1
          grep -Fq 'body.digipublish-shell' "$css" || exit 1

          # Active block CSS/rendering consumes canonical DigiPublish tokens only.
          if grep -R --line-number -E 'var\(--dp-caards-|var\(--tp-(ink|body|muted|brand|brand-dark|accent|border|surface|surface-soft|radius|wide)'             digipublish-core/blocks --include='*.css' --include='*.php'; then
            echo "Active block implementation still consumes compatibility design tokens."
            exit 1
          fi

          # Canonical homepage pattern owns new template composition; legacy slug is hidden.
          test -f digipublish/patterns/editorial-home.php
          grep -Fq 'Slug: digipublish/editorial-home' digipublish/patterns/editorial-home.php || exit 1
          grep -Fq 'Inserter: true' digipublish/patterns/editorial-home.php || exit 1
          grep -Fq 'Inserter: false' digipublish/patterns/caards-home.php || exit 1
          grep -Fq '"slug":"digipublish/editorial-home"' digipublish/templates/front-page.html || exit 1
          grep -Fq '"slug":"digipublish/editorial-home"' digipublish/templates/home.html || exit 1
          ! grep -Fq '"slug":"digipublish/caards-home"' digipublish/templates/front-page.html || exit 1
          ! grep -Fq '"slug":"digipublish/caards-home"' digipublish/templates/home.html || exit 1

          # Canonical interaction controller is active; the old asset is gone.
          test -f "$interactions"
          test ! -f digipublish/assets/js/caards-shell.js
          grep -Fq "assets/js/site-interactions.js" "$funcs" || exit 1
          grep -Fq "'digipublish-site-interactions'" "$funcs" || exit 1
          grep -Fq "'digiPublishSite'" "$funcs" || exit 1
          grep -Fq "digipublish-scheme" "$interactions" || exit 1
          grep -Fq "legacySchemeKey='digipublish-caards-scheme'" "$interactions" || exit 1

          # Site Editor owns visual configuration; admin page is behavior-only.
          grep -Fq "DigiPublish Publishing" "$funcs" || exit 1
          grep -Fq "site-editor.php" "$funcs" || exit 1
          ! grep -Fq "<label for=\"digipublish_caards_header_variant\">" "$funcs" || {
            echo "Header visual selector returned to the publishing settings page."
            exit 1
          }
          ! grep -Fq "<label for=\"digipublish_caards_footer_variant\">" "$funcs" || {
            echo "Footer visual selector returned to the publishing settings page."
            exit 1
          }

          # Active theme code does not directly consume historical visual keys.
          ! grep -Fq "digipublish_caards_header_variant" "$funcs" || exit 1
          ! grep -Fq "digipublish_caards_footer_variant" "$funcs" || exit 1
          ! grep -Fq "digipublish_caards_default_header" "$funcs" || exit 1
          ! grep -Fq "digipublish_caards_default_sidebar" "$funcs" || exit 1
          grep -Fq "digipublish_caards_header_variant" digipublish/inc/compatibility.php || exit 1
          grep -Fq "digipublish_caards_footer_variant" digipublish/inc/compatibility.php || exit 1
          grep -Fq "digipublish_caards_default_header" digipublish/inc/compatibility.php || exit 1
          grep -Fq "digipublish_caards_default_sidebar" digipublish/inc/compatibility.php || exit 1

          grep -Fq "DigiPublish Layout Options" digipublish-core/assets/editor.js || exit 1
          ! grep -Fq "Caards Layout Options" digipublish-core/assets/editor.js || exit 1


      - name: Guard canonical runtime class namespace
        shell: bash
        run: |
          set -euo pipefail
          css="digipublish/assets/css/site.css"
          js="digipublish/assets/js/site-interactions.js"
          compat="digipublish/inc/compatibility.php"

          # Active filesystem markup/renderers use only canonical dp-* classes.
          if grep -R --line-number --fixed-strings 'dp-caards-'             digipublish/parts             digipublish/templates             digipublish-core/blocks/*/render.php             digipublish/functions.php             digipublish/patterns/editorial-home.php; then
            echo "Historical Caards class returned to active theme/runtime markup."
            exit 1
          fi

          for class in dp-header dp-footer dp-entry-hero dp-social-carousel dp-demo-mosaic dp-article-layout dp-newsletter; do
            grep -R -Fq "$class" digipublish digipublish-core || {
              echo "Missing canonical runtime class: $class"
              exit 1
            }
          done

          # CSS pairs canonical selectors with legacy aliases for saved Site Editor markup.
          for pair in             ':is(.dp-header,.dp-caards-header)'             ':is(.dp-footer,.dp-caards-footer)'             ':is(.dp-entry-hero,.dp-caards-entry-hero)'             ':is(.dp-social-carousel,.dp-caards-social-carousel)'             ':is(.dp-demo-mosaic,.dp-caards-demo-mosaic)'             ':is(.dp-article-layout,.dp-caards-article-layout)'; do
            grep -Fq "$pair" "$css" || {
              echo "Missing runtime class compatibility pair: $pair"
              exit 1
            }
          done

          # The interaction controller targets canonical selectors first and
          # retains a small explicit map for previously saved template parts.
          grep -Fq "compatSelector('.dp-header',legacyClass.header)" "$js" || exit 1
          grep -Fq "compatSelector('.dp-singular',legacyClass.singular)" "$js" || exit 1
          grep -Fq "sentinel.className='dp-nextpost-sentinel'" "$js" || exit 1
          grep -Fq "marker.className='dp-header-marker'" "$js" || exit 1
          grep -Fq "header:'.dp-caards-header'" "$js" || exit 1

          # Historical shell class is emitted only through compatibility code.
          ! grep -Fq "dp-caards-shell" digipublish/functions.php || exit 1
          grep -Fq "function digipublish_legacy_shell_body_class" "$compat" || exit 1
          grep -Fq "dp-caards-shell" "$compat" || exit 1

          # The hidden historical homepage pattern remains a compatibility fixture.
          grep -Fq 'Inserter: false' digipublish/patterns/caards-home.php || exit 1
          grep -Fq 'dp-caards-demo-mosaic' digipublish/patterns/caards-home.php || exit 1
          ! grep -Fq 'dp-caards-demo-mosaic' digipublish/patterns/editorial-home.php || exit 1


      - name: Guard Site Editor header/footer ownership
        shell: bash
        run: |
          set -euo pipefail
          funcs="digipublish/functions.php"
          compat="digipublish/inc/compatibility.php"

          for variant in one two three four; do
            header="digipublish/patterns/header-$variant.php"
            footer="digipublish/patterns/footer-$variant.php"
            test -f "$header"
            test -f "$footer"
            grep -Fq "Block Types: core/template-part/header" "$header" || exit 1
            grep -Fq "Block Types: core/template-part/footer" "$footer" || exit 1
            grep -Fq "parts/header-$variant.html" "$header" || exit 1
            grep -Fq "parts/footer-$variant.html" "$footer" || exit 1
          done

          grep -Fq "function digipublish_site_editor_part_is_custom" "$compat" || exit 1
          grep -Fq "get_block_template( get_stylesheet()" "$compat" || exit 1
          grep -Fq "'wp_template_part'" "$compat" || exit 1
          grep -Fq "template->source" "$compat" || exit 1
          grep -Fq "function digipublish_route_legacy_template_parts" "$compat" || exit 1
          grep -Fq "add_filter( 'render_block_data', 'digipublish_route_legacy_template_parts'" "$compat" || exit 1

          # Legacy variant options are isolated to the compatibility layer.
          ! grep -Fq "digipublish_caards_header_variant" "$funcs" || exit 1
          ! grep -Fq "digipublish_caards_footer_variant" "$funcs" || exit 1
          grep -Fq "digipublish_caards_header_variant" "$compat" || exit 1
          grep -Fq "digipublish_caards_footer_variant" "$compat" || exit 1


      - name: Guard canonical publishing settings
        shell: bash
        run: |
          set -euo pipefail
          funcs="digipublish/functions.php"
          compat="digipublish/inc/compatibility.php"
          hero="digipublish-core/blocks/entry-hero/render.php"
          css="digipublish/assets/css/site.css"

          for option in digipublish_load_next_enabled digipublish_load_next_same_category digipublish_load_next_reverse; do
            grep -Fq "$option" "$funcs" || {
              echo "Missing canonical publishing option: $option"
              exit 1
            }
          done

          grep -Fq "digipublish_publishing_settings_migrated_100" "$funcs" || exit 1
          grep -Fq "digipublish_legacy_layout_option" "$funcs" || exit 1
          grep -Fq "digipublish_legacy_layout_option" "$hero" || exit 1

          # Historical functional option names may exist only in the migration map.
          test "$(grep -c "digipublish_caards_load_nextpost_enabled" "$funcs")" -eq 1 || exit 1
          test "$(grep -c "digipublish_caards_load_nextpost_same_category" "$funcs")" -eq 1 || exit 1
          test "$(grep -c "digipublish_caards_load_nextpost_reverse" "$funcs")" -eq 1 || exit 1

          # Visual legacy keys are isolated from active theme/plugin code.
          ! grep -Fq "digipublish_caards_header_variant" "$funcs" || exit 1
