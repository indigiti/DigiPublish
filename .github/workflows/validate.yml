name: Validate DigiPublish

on:
  push:
    branches: ["main", "rebrand/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find digipublish digipublish-core -type f -name '*.php' -print0)

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done < <(find digipublish digipublish-core -type f -name '*.json' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find digipublish digipublish-core -type f -name '*.js' -print0)

      - name: Guard editorial query architecture
        shell: bash
        run: |
          set -euo pipefail
          core="digipublish-core/techpress-editorial.php"
          query="digipublish-core/includes/query.php"
          editor="digipublish-core/assets/editor.js"
          editor_query="digipublish-core/assets/editor-query.js"

          test -f "$query"
          test -f "$editor_query"
          grep -Fq "require_once DIGIPUBLISH_CORE_DIR . 'includes/query.php'" "$core" || exit 1

          for fn in digipublish_core_query_post_args digipublish_core_query_feed_args digipublish_core_query_feed_posts digipublish_core_query_view_all_url; do
            grep -Fq "function $fn" "$query" || {
              echo "Missing canonical query service function: $fn"
              exit 1
            }
          done

          # Query-heavy blocks must consume canonical DigiPublish query APIs.
          grep -Fq 'digipublish_core_query_post_args' digipublish-core/blocks/post-feed/render.php || exit 1
          grep -Fq 'digipublish_core_query_post_args' digipublish-core/blocks/featured-posts/render.php || exit 1
          grep -Fq 'digipublish_core_query_feed_posts' digipublish-core/blocks/editorial-feed/render.php || exit 1
          grep -Fq 'digipublish_core_query_feed_posts' digipublish-core/blocks/sidebar-feed/render.php || exit 1

          # Legacy query names may exist only as compatibility wrappers in query.php.
          if grep -R --line-number --include='*.php' -E 'techpress_editorial_(post_query_args|feed_query_args|feed_get_posts|feed_view_all_url)[[:space:]]*\(' digipublish-core/blocks; then
            echo "A block renderer bypasses the canonical DigiPublish query service."
            exit 1
          fi

          grep -Fq "digipublish-core-editor-query" "$core" || exit 1
          grep -Fq "DigiPublishEditorQuery" "$editor_query" || exit 1
          grep -Fq "DigiPublishEditorQuery" "$editor" || exit 1

          # Keep the main bootstrap/editor from absorbing the extracted modules again.
          test "$(wc -c < "$core")" -lt 60000 || {
            echo "Core bootstrap exceeded the architectural size budget."
            exit 1
          }
          test "$(wc -c < "$editor")" -lt 138000 || {
            echo "Main editor bundle exceeded the current size budget."
            exit 1
          }


      - name: Guard dependency-free runtime
        shell: bash
        run: |
          set -euo pipefail

          # No Classic Widgets runtime. Gutenberg patterns/blocks own all layout composition.
          if grep -R --line-number --include='*.php' -E 'register_sidebar[[:space:]]*\(|dynamic_sidebar[[:space:]]*\(|the_widget[[:space:]]*\(' digipublish digipublish-core; then
            echo "Classic Widgets runtime dependency found."
            exit 1
          fi

          # No remote Google Fonts dependency in the production theme/plugin.
          if grep -R --line-number -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' digipublish digipublish-core; then
            echo "Remote font dependency found."
            exit 1
          fi

          # Guard the original Caards runtime libraries from returning.
          if grep -R --line-number --include='*.js' -E 'new[[:space:]]+Flickity|Colcade[[:space:]]*\(|magnificPopup[[:space:]]*\(' digipublish digipublish-core; then
            echo "Retired Caards JavaScript runtime dependency found."
            exit 1
          fi

          grep -Fq 'digipublish_core_post_feed_loop_pattern' digipublish-core/techpress-editorial.php || exit 1
          grep -Fq 'masonryPatternId' digipublish-core/blocks/post-feed/block.json || exit 1
          grep -Fq 'useSyncedPatternOptions' digipublish-core/assets/editor.js || exit 1


      - name: Guard obsolete theme-part slug
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings '"theme":"techpress-theme"' digipublish/templates digipublish/parts; then
            echo "Obsolete techpress-theme template-part reference found."
            exit 1
          fi


      - name: Guard retired block namespace
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'techpress/' digipublish digipublish-core; then
            echo "Retired Gutenberg block namespace found."
            exit 1
          fi


      - name: Guard stale generated block classes
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'wp-block-techpress-' digipublish digipublish-core; then
            echo "Stale pre-DigiPublish generated block CSS class found."
            exit 1
          fi
          if grep -R --line-number --fixed-strings "category: 'digipublish-core'" digipublish-core/assets; then
            echo "Custom blocks must use the digipublish-editorial inserter category."
            exit 1
          fi


      - name: Verify block and homepage inventory
        shell: bash
        run: |
          set -euo pipefail
          core="digipublish-core/techpress-editorial.php"
          manifest="digipublish-core/blocks-manifest.php"

          test -f "$manifest"
          test -f digipublish-core/blocks-manifest-a.php
          test -f digipublish-core/blocks-manifest-b.php
          grep -Fq 'wp_register_block_types_from_metadata_collection' "$core" || exit 1
          ! grep -Fq '$blocks = array(' "$core" || {
            echo "Hardcoded block registration list returned."
            exit 1
          }

          manifest_count="$(php -r '$m=require $argv[1]; echo count($m);' "$manifest")"
          directory_count="$(find digipublish-core/blocks -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$manifest_count" = "$directory_count" || {
            echo "Block metadata manifest count ($manifest_count) does not match block directory count ($directory_count)."
            exit 1
          }

          for dir in digipublish-core/blocks/*; do
            [ -d "$dir" ] || continue
            block="$(basename "$dir")"
            test -f "$dir/block.json"
            jq -e --arg expected "digipublish/$block" '.name == $expected' "$dir/block.json" >/dev/null
            php -r '$m=require $argv[1]; exit(isset($m[$argv[2]]) ? 0 : 1);' "$manifest" "$block" || {
              echo "Block directory is missing from metadata manifest: $block"
              exit 1
            }
          done

          while IFS= read -r slug; do
            test -f "digipublish/patterns/$slug.php" || {
              echo "Homepage references a missing pattern: $slug"
              exit 1
            }
          done < <(sed -n 's/.*wp:pattern {"slug":"digipublish\/\([^"]*\)".*/\1/p' digipublish/patterns/homepage.php)

          for required in business-markets top-weekly science-space travels wearables latest-posts-cards technology-compact; do
            grep -Fq "\"slug\":\"digipublish/$required\"" digipublish/patterns/homepage.php || {
              echo "Required homepage section is missing: $required"
              exit 1
            }
          done

      - name: Guard Posts block controls and layouts
        shell: bash
        run: |
          set -euo pipefail
          block="digipublish-core/blocks/post-feed/block.json"
          editor="digipublish-core/assets/editor.js"
          editor_query="digipublish-core/assets/editor-query.js"
          render="digipublish-core/blocks/post-feed/render.php"
          css="digipublish-core/blocks/post-feed/style.css"
          view="digipublish-core/blocks/post-feed/view.js"
          core="digipublish-core/techpress-editorial.php"

          jq -e '
            .title == "Posts" and
            .attributes.postType.default == "post" and
            .attributes.postFormats.type == "array" and
            .attributes.filterTaxonomy.type == "string" and
            .attributes.filterTermIds.type == "array" and
            .attributes.relatedPosts.default == false and
            .attributes.topMetaType.default == "" and
            .attributes.compactMeta.default == false and
            .attributes.cardHeadingTag.default == "h2" and
            .attributes.excerptLength.default == 100 and
            .attributes.imageOrientation.default == "original" and
            .attributes.carouselAutoplay.default == true and
            .attributes.carouselDots.default == true and
            .attributes.carouselWrap.default == true and
            .attributes.customCss.type == "string" and
            .supports.anchor == true and
            .supports.customClassName == true
          ' "$block" >/dev/null

          for layout in standard-1 standard-2 standard-3 standard-4 masonry-1 horizontal-1 horizontal-2 horizontal-3 horizontal-4 horizontal-5 tile-1 tile-2 tile-3 tile-4 carousel-1 carousel-2; do
            grep -Fq "value:'$layout'" "$editor" || {
              echo "Missing Posts editor layout: $layout"
              exit 1
            }
            grep -Fq "'$layout'" "$render" || {
              echo "Missing Posts renderer layout: $layout"
              exit 1
            }
          done

          for label in "Block Settings" "Load More" "Infinite Load" "Top Meta Type" "Author" "Category" "Count" "Display compact post meta" "Excerpt length" "Heading Font Size" "Image Orientation" "Enable autoplay" "Enable bullets" "Enable wrap-around" "Filter by Formats" "Filter by Taxonomy" "Filter by Terms" "Display Related Posts" "Avoid Duplicate Posts" "Spacings" "Borders" "Responsive Settings" "Additional CSS"; do
            grep -Fq "$label" "$editor" "$editor_query" || {
              echo "Missing Posts inspector control: $label"
              exit 1
            }
          done

          grep -Fq 'safecss_filter_attr' "$render" || exit 1
          grep -Fq 'data-dp-post-carousel-track' "$render" || exit 1
          grep -Fq 'data-dp-load-more' "$render" || exit 1
          grep -Fq 'data-dp-infinite-sentinel' "$render" || exit 1
          grep -Fq '.tp-feed--masonry-1' "$css" || exit 1
          grep -Fq '.tp-feed--carousel-1' "$css" || exit 1
          grep -Fq 'IntersectionObserver' "$view" || exit 1
          grep -Fq 'digipublish/v1' "$core" || exit 1
          grep -Fq 'GPL-3.0 Caards theme by Code Supply Co.' "$core" || exit 1
          grep -Fq 'Caards 1.0.4' THIRD_PARTY_NOTICES.md || exit 1


      - name: Guard Caards full theme port
        shell: bash
        run: |
          set -euo pipefail

          for part in header-one header-two header-three header-four footer-one footer-two footer-three footer-four; do
            test -f "digipublish/parts/$part.html" || {
              echo "Missing Caards template part: $part"
              exit 1
            }
          done

          for template in single-standard single-large single-full single-title single-no-sidebar page-large page-full page-title page-no-title meet-team; do
            test -f "digipublish/templates/$template.html" || {
              echo "Missing Caards template: $template"
              exit 1
            }
          done

          for block in entry-hero current-date custom-link instagram-carousel twitter-carousel team-grid mega-menu; do
            test -f "digipublish-core/blocks/$block/block.json"
            test -f "digipublish-core/blocks/$block/render.php"
            jq -e --arg expected "digipublish/$block" '.name == $expected' "digipublish-core/blocks/$block/block.json" >/dev/null
            php -r '$m=require $argv[1]; exit(isset($m[$argv[2]]) ? 0 : 1);' digipublish-core/blocks-manifest.php "$block" || {
              echo "Caards-derived block missing from metadata manifest: $block"
              exit 1
            }
          done

          grep -Fq '"name": "header-four"' digipublish/theme.json || exit 1
          grep -Fq '"name": "footer-four"' digipublish/theme.json || exit 1
          grep -Fq '"name": "single-full"' digipublish/theme.json || exit 1
          grep -Fq '"name": "meet-team"' digipublish/theme.json || exit 1

          grep -Fq 'digipublish_caards_header_variant' digipublish/functions.php || exit 1
          grep -Fq 'digipublish_caards_footer_variant' digipublish/functions.php || exit 1
          grep -Fq 'digipublish_caards_default_header' digipublish/functions.php || exit 1
          grep -Fq 'digipublish_caards_default_sidebar' digipublish/functions.php || exit 1
          grep -Fq 'render_block_data' digipublish/functions.php || exit 1
          grep -Fq 'digipublish/v1/load-next-post' digipublish/functions.php || exit 1

          grep -Fq '.dp-caards-header' digipublish/assets/css/site.css || exit 1
          grep -Fq '.dp-caards-footer' digipublish/assets/css/site.css || exit 1
          grep -Fq '.dp-caards-entry-hero--full' digipublish/assets/css/site.css || exit 1
          grep -Fq '.dp-caards-social-carousel' digipublish/assets/css/site.css || exit 1
          grep -Fq 'data-dp-fullscreen-toggle' digipublish/assets/js/caards-shell.js || exit 1
          grep -Fq 'IntersectionObserver' digipublish/assets/js/caards-shell.js || exit 1
          grep -Fq 'Caards 1.0.4' THIRD_PARTY_NOTICES.md || exit 1


      - name: Guard Caards visual fidelity cleanup
        shell: bash
        run: |
          set -euo pipefail
          css="digipublish/assets/css/site.css"
          home="digipublish/patterns/caards-home.php"
          header="digipublish/parts/header-one.html"
          funcs="digipublish/functions.php"

          ! grep -Fq -- '--tp-ink:#101d3d' "$css" || {
            echo "Legacy DigiPublish blue/ink shell returned."
            exit 1
          }
          ! grep -Fq 'techpress-site' "$funcs" || {
            echo "Obsolete Techpress frontend class returned."
            exit 1
          }

          for class in dp-caards-demo-mosaic dp-caards-mosaic-card--feature dp-caards-mosaic-card--social dp-caards-mosaic-card--dark dp-caards-mosaic-card--portrait dp-caards-mosaic-card--mini dp-caards-mosaic-card--rail-feature; do
            grep -Fq "$class" "$home" || {
              echo "Missing Caards homepage mosaic element: $class"
              exit 1
            }
            grep -Fq "$class" "$css" || {
              echo "Missing Caards homepage mosaic styling: $class"
              exit 1
            }
          done

          grep -Fq 'border-radius:var(--dp-caards-radius)' "$css" || exit 1
          grep -Fq 'max-width:var(--dp-caards-container)' "$css" || exit 1
          grep -Fq 'dp-caards-nav-more' "$header" || exit 1
          grep -Fq '⚡ Features' "$header" || exit 1
          ! grep -Fq 'digipublish/current-date' "$header" || {
            echo "Header 1 still contains the non-Caards date control."
            exit 1
          }


      - name: Guard Caards block parity
        shell: bash
        run: |
          set -euo pipefail
          editor="digipublish-core/assets/editor.js"
          core="digipublish-core/techpress-editorial.php"

          for block in section-heading section section-content section-sidebar opt-in-form featured-categories current-date category-nav custom-link instagram-carousel twitter-carousel post-feed; do
            test -f "digipublish-core/blocks/$block/block.json" || {
              echo "Missing Caards parity block: $block"
              exit 1
            }
            jq -e --arg expected "digipublish/$block" '.name == $expected' "digipublish-core/blocks/$block/block.json" >/dev/null
            php -r '$m=require $argv[1]; exit(isset($m[$argv[2]]) ? 0 : 1);' digipublish-core/blocks-manifest.php "$block" || {
              echo "Caards parity block missing from metadata manifest: $block"
              exit 1
            }
          done

          # Current Date source fields.
          jq -e '
            .attributes.format.default == "F d, Y" and
            .attributes.textAlign.default == "left" and
            .attributes.fontSizeDesktop.default == "0.75rem"
          ' digipublish-core/blocks/current-date/block.json >/dev/null

          # Category Navigation source fields.
          jq -e '
            .attributes.filterCategoryIds.type == "array" and
            .attributes.orderBy.default == "name" and
            .attributes.order.default == "ASC" and
            .attributes.maximum.default == 0 and
            .attributes.alignment.default == "center"
          ' digipublish-core/blocks/category-nav/block.json >/dev/null

          # Custom Link source fields and Styled variation.
          jq -e '
            .attributes.label.default == "View All" and
            .attributes.url.default == "/" and
            .attributes.styleVariant.default == "default" and
            .attributes.textAlign.default == "left" and
            .attributes.disableLabelMobile.default == false
          ' digipublish-core/blocks/custom-link/block.json >/dev/null

          # Social layouts.
          grep -Fq "Diagonal Carousel" "$editor" || exit 1
          grep -Fq "value:'carousel-full'" "$editor" || exit 1
          grep -Fq "Twitter / X" "$editor" || exit 1
          test -f digipublish-core/blocks/instagram-carousel/view.js
          test -f digipublish-core/blocks/twitter-carousel/view.js

          # Section/heading extensions from Caards' Canvas filters.
          for label in "Border Color" "Accent Color" "Accent Contrast Color" "Text Color" "Sidebar Width — Desktop" "Background Color"; do
            grep -Fq "$label" "$editor" || {
              echo "Missing Caards Section control: $label"
              exit 1
            }
          done

          # Remaining Posts layout fields from the source layouts.
          for label in "Margin Content" "Vertical Align Content" "Vertical Align Image" "Image Width" "Enable post format" "Enable video backgrounds" "Enable video controls" "Heading Color" "Post Meta Links Hover" "Read More Text Color Hover" "Insert a synced pattern between posts" "Synced pattern" "Insert after every N-th post" "Repeat pattern"; do
            grep -Fq "$label" "$editor" || {
              echo "Missing Caards Posts source field: $label"
              exit 1
            }
          done

          grep -Fq "digipublish_post_video_url" "$core" || exit 1
          grep -Fq "digipublish_core_post_feed_loop_pattern" "$core" || exit 1
          grep -Fq "masonryPatternId" "$core" || exit 1
          ! grep -Fq "register_sidebar(" "$core" || {
            echo "Classic Widget area registration returned."
            exit 1
          }

          # Caards Powerkit block extensions.
          for label in "Input Background" "Button Background Hover" "Vertical List Alt"; do
            grep -Fq "$label" "$editor" || {
              echo "Missing Caards Powerkit extension: $label"
              exit 1
            }
          done


      - name: Guard Caards block settings parity
        shell: bash
        run: |
          set -euo pipefail
          posts="digipublish-core/blocks/post-feed/block.json"
          editor="digipublish-core/assets/editor.js"
          render="digipublish-core/blocks/post-feed/render.php"
          css="digipublish-core/blocks/post-feed/style.css"
          core="digipublish-core/techpress-editorial.php"

          jq -e '
            .attributes.layout.default == "standard-1" and
            .attributes.postsToShow.default == 1 and
            .attributes.showExcerpt.default == true and
            .attributes.showViews.default == true and
            .attributes.showReadTime.default == true and
            .attributes.showShares.default == true and
            .attributes.showReadMore.default == true and
            .attributes.columnsLaptop.type == "integer" and
            .attributes.columnGapDesktop.type == "string" and
            .attributes.columnGapLaptop.type == "string" and
            .attributes.columnGapTablet.type == "string" and
            .attributes.columnGapMobile.type == "string" and
            .attributes.rowGapDesktop.type == "string" and
            .attributes.rowGapLaptop.type == "string" and
            .attributes.rowGapTablet.type == "string" and
            .attributes.rowGapMobile.type == "string" and
            .attributes.contentGapDesktop.type == "string" and
            .attributes.contentGapMobile.type == "string" and
            .attributes.cardMinHeightLaptop.type == "string" and
            .attributes.cardHeadingFontSizeLaptop.type == "string" and
            .attributes.excerptFontSizeLaptop.type == "string" and
            .attributes.masonryWidgetsRepeat.default == true
          ' "$posts" >/dev/null

          for label in             "Number of Columns — Laptop"             "Gap between Posts"             "Margin Content"             "Vertical Align Content"             "Vertical Align Image"             "Image Width"             "Enable post format"             "Enable video backgrounds"             "Enable video controls"             "Heading Color Hover"             "Post Meta Links Hover"             "Masonry Pattern"             "Repeat pattern"; do
            grep -Fq "$label" "$editor" || {
              echo "Missing Caards Posts setting: $label"
              exit 1
            }
          done

          grep -Fq -- '--dp-columns-laptop' "$render" || exit 1
          grep -Fq 'columnGapLaptop' "$render" || exit 1
          grep -Fq -- '--dp-content-gap-' "$render" || exit 1
          grep -Fq -- '--dp-card-heading-size-' "$render" || exit 1
          grep -Fq '@media(min-width:1020px) and (max-width:1199px)' "$css" || exit 1
          grep -Fq '@media(min-width:600px) and (max-width:1019px)' "$css" || exit 1
          grep -Fq "horizontal-5' === \$semantic_layout ? 'thumbnail'" "$core" || exit 1
          grep -Fq 'digipublish_post_video_url' "$core" || exit 1
          grep -Fq 'digipublish_core_post_feed_loop_pattern' "$core" || exit 1

          jq -e '
            .attributes.showDictionary.default == false and
            .attributes.showGallery.default == false and
            .attributes.showSearch.default == false and
            .attributes.maximum.default == 0 and
            .attributes.alignment.default == "center"
          ' digipublish-core/blocks/category-nav/block.json >/dev/null
          grep -Fq "Show Photo Galleries (DigiPublish extension)" "$editor" || exit 1
          grep -Fq "showGallery" digipublish-core/blocks/category-nav/render.php || exit 1

          jq -e '.attributes.fontSizeLaptop.type == "string"' digipublish-core/blocks/current-date/block.json >/dev/null
          jq -e '.attributes.fontSizeLaptop.type == "string"' digipublish-core/blocks/custom-link/block.json >/dev/null

          for block in section-heading section-content section-sidebar; do
            jq -e '
              .attributes.hideDesktop.default == false and
              .attributes.hideLaptop.default == false and
              .attributes.hideTablet.default == false and
              .attributes.hideMobile.default == false
            ' "digipublish-core/blocks/$block/block.json" >/dev/null
          done

          jq -e '.attributes.layout.default == "default" and .attributes.diagonalCardMinHeight.default == "480px"' digipublish-core/blocks/instagram-carousel/block.json >/dev/null
          jq -e '.attributes.layout.default == "default"' digipublish-core/blocks/twitter-carousel/block.json >/dev/null
          grep -Fq "Diagonal Carousel" "$editor" || exit 1
          grep -Fq "carousel-full" digipublish-core/blocks/instagram-carousel/render.php || exit 1

      - name: Guard mobile and carousel regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'margin-left:calc(var(--wp--style--root--padding-left,0px)*-1)' digipublish/assets/css/site.css; then
            echo "Root-padding negative-margin regression found."
            exit 1
          fi
          if grep -Fq 'grid-auto-columns:minmax(260px,1fr)' digipublish-core/blocks/editorial-feed/style.css; then
            echo "Elastic single-card carousel regression found."
            exit 1
          fi


      - name: Guard Featured mobile alignment
        shell: bash
        run: |
          set -euo pipefail
          css="digipublish-core/blocks/featured-posts/style.css"
          site="digipublish/assets/css/site.css"
          grep -Fq '.tp-home-top>.wp-block-digipublish-featured-posts.alignwide' "$css" || exit 1
          grep -Fq '.tp-featured__more{display:none}' "$css" || exit 1
          grep -Fq 'padding:12px 16px 22px!important' "$site" || exit 1
          grep -Fq 'min-height:44px' "$css" || exit 1


      - name: Guard homepage resilience
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"fallbackRandom":true' digipublish/patterns/top-weekly.php || {
            echo "Top Weekly random fallback is missing."
            exit 1
          }
          grep -Fq 'fallbackRandom' digipublish-core/blocks/editorial-feed/block.json || {
            echo "Editorial Feed random fallback attribute is missing."
            exit 1
          }
          if grep -R --line-number --include='*.php' -E "['\"]orderby['\"][[:space:]]*=>[[:space:]]*['\"]rand['\"]|['\"][^'\"]*ORDER[[:space:]]+BY[[:space:]]+RAND\(" digipublish digipublish-core; then
            echo "Database-level random ordering must not be used."
            exit 1
          fi
          grep -Fq "'hide_empty' => false" digipublish-core/blocks/popular-categories/render.php || {
            echo "Popular Categories sparse-site fallback is missing."
            exit 1
          }
          grep -Fq 'tp-term-index__empty' digipublish-core/blocks/term-index/render.php || {
            echo "Dictionary fresh-site empty state is missing."
            exit 1
          }


      - name: Guard post sidebar widgets
        shell: bash
        run: |
          set -euo pipefail
          test -f digipublish-core/blocks/sidebar-feed/block.json
          jq -e '.name == "digipublish/sidebar-feed"' digipublish-core/blocks/sidebar-feed/block.json >/dev/null
          php -r '$m=require $argv[1]; exit(isset($m["sidebar-feed"]) ? 0 : 1);' digipublish-core/blocks-manifest.php || exit 1
          grep -Fq 'digipublish/article-sidebar-widgets' digipublish/parts/sidebar.html || exit 1
          grep -Fq '"layout":"meta-list"' digipublish/patterns/article-sidebar-widgets.php || exit 1
          grep -Fq '"layout":"ranked-list"' digipublish/patterns/article-sidebar-widgets.php || exit 1
          grep -Fq '"layout":"image-grid"' digipublish/patterns/article-sidebar-widgets.php || exit 1
          grep -Fq "registerBlockVariation('digipublish/sidebar-feed'" digipublish-core/assets/editor.js || exit 1


      - name: Guard photo gallery publishing system
        shell: bash
        run: |
          set -euo pipefail
          test -f digipublish-core/includes/gallery.php
          test -f digipublish-core/blocks/gallery/block.json
          test -f digipublish-core/blocks/gallery-slide/block.json
          test -f digipublish-core/blocks/gallery-archive/block.json
          test -f digipublish/templates/single-digipublish_gallery.html
          test -f digipublish/templates/archive-digipublish_gallery.html

          expected_version="$(awk '/^Version:/{print $2; exit}' digipublish/style.css)"
          core_version="$(awk '/^[[:space:]]*\* Version:/{print $3; exit}' digipublish-core/techpress-editorial.php)"
          test -n "$expected_version"
          test "$core_version" = "$expected_version" || {
            echo "Theme/Core version mismatch: theme=$expected_version core=$core_version"
            exit 1
          }

          jq -e --arg version "$expected_version" '.name == "digipublish/gallery" and .version == $version' digipublish-core/blocks/gallery/block.json >/dev/null
          jq -e --arg version "$expected_version" '.name == "digipublish/gallery-slide" and .version == $version' digipublish-core/blocks/gallery-slide/block.json >/dev/null
          jq -e --arg version "$expected_version" '.name == "digipublish/gallery-archive" and .version == $version' digipublish-core/blocks/gallery-archive/block.json >/dev/null

          grep -Fq "require_once DIGIPUBLISH_CORE_DIR . 'includes/gallery.php'" digipublish-core/techpress-editorial.php || exit 1
          grep -Fq "register_post_type(" digipublish-core/includes/gallery.php || exit 1
          grep -Fq "'digipublish_gallery'" digipublish-core/includes/gallery.php || exit 1
          grep -Fq "^photo-gallery/(?!category/)" digipublish-core/includes/gallery.php || exit 1
          grep -Fq "'@type'            => 'ImageGallery'" digipublish-core/includes/gallery.php || exit 1
          grep -Fq "registerBlockType('digipublish/gallery'" digipublish-core/assets/editor.js || exit 1
          grep -Fq "registerBlockType('digipublish/gallery-slide'" digipublish-core/assets/editor.js || exit 1
          grep -Fq "registerBlockType('digipublish/gallery-archive'" digipublish-core/assets/editor.js || exit 1
          grep -Fq '"contentType"' digipublish-core/blocks/sidebar-feed/block.json || exit 1
          grep -Fq 'digipublish_gallery' digipublish-core/blocks/sidebar-feed/render.php || exit 1
          grep -Fq 'Photo Galleries' digipublish-core/blocks/category-nav/render.php || exit 1

          for block_json in digipublish-core/blocks/*/block.json; do
            jq -e --arg version "$expected_version" '.version == $version' "$block_json" >/dev/null || {
              echo "Block version mismatch: $block_json (expected $expected_version)"
              exit 1
            }
          done


      - name: Guard Read Next related stories
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(awk '/^Version:/{print $2; exit}' digipublish/style.css)"
          jq -e --arg version "$expected_version" '.name == "digipublish/related-posts" and .version == $version and .attributes.layout.default == "features" and .attributes.relationMode.default == "category-tags"' digipublish-core/blocks/related-posts/block.json >/dev/null
          grep -Fq '"heading":"Read next"' digipublish/templates/single.html || exit 1
          grep -Fq '"layout":"read-next"' digipublish/templates/single.html || exit 1
          grep -Fq '"relationMode":"category-tags"' digipublish/templates/single.html || exit 1
          grep -Fq "registerBlockVariation('digipublish/related-posts'" digipublish-core/assets/editor.js || exit 1
          grep -Fq "wp_get_post_tags" digipublish-core/blocks/related-posts/render.php || exit 1
          grep -Fq "array_intersect" digipublish-core/blocks/related-posts/render.php || exit 1
          grep -Fq ".tp-related-posts--read-next" digipublish-core/blocks/related-posts/style.css || exit 1
